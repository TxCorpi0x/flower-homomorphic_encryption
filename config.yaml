# ZKFL Configuration File
# This file contains all configuration options for the Zero-Knowledge Federated Learning framework
# Supports Classic FL, FHE, Zero-Knowledge proofs, and Differential Privacy

# Network Configuration
network:
  server_address: "localhost"
  server_port: 8080
  client_timeout: 30
  max_retries: 3
  use_ssl: false
  ssl_cert_path: null
  ssl_key_path: null

# Privacy Configuration (Differential Privacy)
privacy:
  enable_dp: true
  epsilon: 1.0
  delta: 1.0e-05
  noise_multiplier: 1.0
  max_grad_norm: 1.0
  privacy_accountant: "rdp"

# Cryptographic Configuration (Zero-Knowledge Proofs)
crypto:
  enable_zk_proofs: true
  proof_system: "groth16"
  key_size: 2048
  hash_algorithm: "sha256"
  encryption_algorithm: "aes256"
  enable_homomorphic: false

# Blockchain Configuration
blockchain:
  enable_blockchain: false
  network_url: "http://localhost:8545"
  contract_address: null
  private_key: null
  gas_limit: 6000000
  gas_price: 20000000000

# Model Configuration
model:
  model_type: "simple_cnn"
  input_shape: [32, 32, 3]
  num_classes: 10
  hidden_units: [64, 32]
  dropout_rate: 0.2
  activation: "relu"
  optimizer: "adam"
  learning_rate: 0.001
  batch_size: 32
  local_epochs: 5

# Data Configuration
data:
  dataset_name: "cifar10"
  data_path: "./data"
  partition_strategy: "iid"
  num_clients: 10
  alpha: 0.5
  min_samples_per_client: 100
  validation_split: 0.2
  normalize_data: true
  augment_data: false

# Federated Learning Configuration
federated:
  num_rounds: 100
  fraction_fit: 0.1
  fraction_evaluate: 0.1
  min_fit_clients: 2
  min_evaluate_clients: 2
  min_available_clients: 2
  aggregation_strategy: "fedavg"
  server_round_timeout: null

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_to_file: true
  log_dir: "./logs"
  enable_structured_logging: true
  enable_audit_logging: true
  max_log_size: 10485760
  backup_count: 5

# Experiment Configuration
experiment:
  experiment_name: "zkfl_experiment"
  output_dir: "./outputs"
  save_model: true
  save_metrics: true
  checkpoint_frequency: 10
  early_stopping_patience: 20
  random_seed: 42