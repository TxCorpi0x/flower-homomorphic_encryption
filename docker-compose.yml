services:
  init:
    platform: linux/amd64
    build: .
    image: flower-he:latest
    container_name: fl_init
    working_dir: /app
    command: >
      bash -lc "
        python create_keys.py && \
        python create_zkp_params.py && \
        python create_dp_params.py && \
        echo 'Init done'"
    volumes:
      - ./:/app
    profiles: [init]

  # ---------------- Baseline ----------------
  server_baseline:
    platform: linux/amd64
    image: flower-he:latest
    build: .
    container_name: fl_server_baseline
    environment:
      - FL_SERVER_ADDRESS=0.0.0.0:8081
      - FL_SIMULATION=0
    command:
      - python
      - main_server.py
      - server
      - --rounds
      - "3"
      - --number_clients
      - "2"
      - --batch_size
      - "32"
      - --dataset
      - cifar
      - --data_path
      - ./data/cifar/
      - --device
      - cpu
      - --benchmark
      - --min_fit_clients
      - "2"
      - --min_avail_clients
      - "2"
      - --min_eval_clients
      - "1"
      - --frac_fit
      - "1.0"
      - --frac_eval
      - "0.5"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8081 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 30
    volumes:
      - ./:/app
    profiles: [baseline, all]

  client_baseline_0:
    platform: linux/amd64
    image: flower-he:latest
    build: .
    container_name: fl_client_baseline_0
    environment:
      - FL_SERVER_ADDRESS=server_baseline:8081
      - FL_SIMULATION=0
    command:
      - python
      - main_client.py
      - client
      - --id_client
      - "0"
      - --number_clients
      - "2"
      - --dataset
      - cifar
      - --data_path
      - ./data/cifar/
      - --device
      - cpu
      - --batch_size
      - "32"
      - --save_results
      - ./results/baseline
      - --benchmark
    volumes:
      - ./:/app
    depends_on:
      server_baseline:
        condition: service_healthy
    profiles: [baseline, all]

  client_baseline_1:
    platform: linux/amd64
    image: flower-he:latest
    build: .
    container_name: fl_client_baseline_1
    environment:
      - FL_SERVER_ADDRESS=server_baseline:8081
      - FL_SIMULATION=0
    command:
      - python
      - main_client.py
      - client
      - --id_client
      - "1"
      - --number_clients
      - "2"
      - --dataset
      - cifar
      - --data_path
      - ./data/cifar/
      - --device
      - cpu
      - --batch_size
      - "32"
      - --save_results
      - ./results/baseline
      - --benchmark
    volumes:
      - ./:/app
    depends_on:
      server_baseline:
        condition: service_healthy
    profiles: [baseline, all]

  # ---------------- HE (TenSEAL) ----------------
  server_he:
    platform: linux/amd64
    image: flower-he:latest
    build: .
    container_name: fl_server_he
    environment:
      - FL_SERVER_ADDRESS=0.0.0.0:8082
      - FL_SIMULATION=0
    command:
      - python
      - main_server.py
      - server
      - --he
      - --he_backend
      - tenseal
      - --rounds
      - "3"
      - --number_clients
      - "2"
      - --batch_size
      - "32"
      - --dataset
      - cifar
      - --data_path
      - ./data/cifar/
      - --device
      - cpu
      - --benchmark
      - --min_fit_clients
      - "2"
      - --min_avail_clients
      - "2"
      - --min_eval_clients
      - "1"
      - --frac_fit
      - "1.0"
      - --frac_eval
      - "0.5"
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8082 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 30
    volumes:
      - ./:/app
    profiles: [he, all]

  client_he_0:
    platform: linux/amd64
    image: flower-he:latest
    build: .
    container_name: fl_client_he_0
    environment:
      - FL_SERVER_ADDRESS=server_he:8082
      - FL_SIMULATION=0
