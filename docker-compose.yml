      - client
      - --id_client
      - "1"
      - --number_clients
      - "2"
      - --dataset
      - cifar
      - --data_path
      - ./data/cifar/
      - --device
      - cpu
      - --batch_size
      - "32"
      - --save_results
      - ./results/he_tenseal
      - --benchmark
      - --he
      - --he_backend
      - tenseal
      - --path_keys
      - secret.pkl
      - --path_crypted
      - server.pkl
    volumes:
      - ./:/app
    depends_on:
      server_he:
        condition: service_healthy
    profiles: [he, all]

  # ---------------- ZKP ----------------
  server_zkp:
    platform: linux/amd64
    image: flower-he:latest
    build: .
    container_name: fl_server_zkp
    environment:
      - FL_SERVER_ADDRESS=0.0.0.0:8083
      - FL_SIMULATION=0
