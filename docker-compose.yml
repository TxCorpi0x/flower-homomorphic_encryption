  # ---------------- Aggregator (optional) ----------------
  aggregate:
    platform: linux/amd64
    image: flower-he:latest
    build: .
    container_name: fl_aggregate
    working_dir: /app
    command: >
      bash -lc "
        python scripts/aggregate_results.py \
          --root ./results \
          --modes baseline,he_tenseal,zkp,dp \
          --output_dir ./results/docker_compare"
    volumes:
      - ./:/app
    profiles: [aggregate, all]

networks:
  default:
    name: flnet
    driver: bridge
