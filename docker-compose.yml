      - --id_client
      - "0"
      - --number_clients
      - "2"
      - --dataset
      - cifar
      - --data_path
      - ./data/cifar/
      - --device
      - cpu
      - --batch_size
      - "32"
      - --save_results
      - ./results/he_tenseal
      - --benchmark
      - --he
      - --he_backend
      - tenseal
      - --path_keys
      - secret.pkl
      - --path_crypted
      - server.pkl
    volumes:
      - ./:/app
    depends_on:
      server_he:
        condition: service_healthy
    profiles: [he, all]

  client_he_1:
