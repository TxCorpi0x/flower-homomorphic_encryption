      - client
      - --id_client
      - "1"
      - --number_clients
      - "2"
      - --dataset
      - cifar
      - --data_path
      - ./data/cifar/
      - --device
      - cpu
      - --batch_size
      - "32"
      - --save_results
      - ./results/zkp
      - --benchmark
