    depends_on:
      server_zkp:
        condition: service_healthy
    profiles: [zkp, all]

  # ---------------- DP ----------------
  server_dp:
    platform: linux/amd64
    image: flower-he:latest
    build: .
    container_name: fl_server_dp
    environment:
      - FL_SERVER_ADDRESS=0.0.0.0:8084
      - FL_SIMULATION=0
    command:
      - python
      - main_server.py
      - server
      - --dp
      - --dp_params
      - dp_params.pkl
      - --rounds
      - "3"
      - --number_clients
      - "2"
      - --batch_size
      - "32"
      - --dataset
